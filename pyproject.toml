[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dhahabu"
version = "0.1.0"
description = "XAUUSD Trading Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",

    # Scheduling
    "apscheduler>=3.10.4",

    # HTTP / async
    "httpx>=0.27.0",
    "aiohttp>=3.9.5",
    "tenacity>=8.3.0",

    # Data / quant
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "scipy>=1.13.0",

    # Config
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",

    # Telegram
    "python-telegram-bot>=21.3",

    # Broker integrations
    "ctrader-open-api>=0.9.2",

    # Logging / observability
    "structlog>=24.2.0",
    "rich>=13.7.1",

    # Utilities
    "python-dateutil>=2.9.0",
    "pytz>=2024.1",
    "orjson>=3.10.3",
    "cachetools>=5.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "black>=24.4.2",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
    "types-python-dateutil>=2.9.0",
    "sqlalchemy[mypy]>=2.0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["backend"]
omit = ["*/tests/*", "*/migrations/*"]
